<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our Trip Home</title>
  <meta name="description" content="Our December trip schedule — see where we'll be and suggest plans.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23C8553D'/%3E%3Cpath d='M7 18l18-7-6 13-3-5z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="banner" class="banner" hidden></div>

  <header class="top">
    <div class="wrap top-inner">
      <div class="brand">
        <p id="dates" class="eyebrow"></p>
        <h1 id="title"></h1>
        <p id="subtitle" class="sub"></p>
      </div>
      <div class="actions">
        <button id="langBtn" class="btn ghost small" type="button"></button>
        <button id="shareBtn" class="btn ghost small" type="button"></button>
        <button id="lockBtn" class="btn ghost small" type="button"></button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section id="stats" class="stats" aria-label="Summary"></section>

    <section id="suggestions" class="suggestions" hidden></section>

    <div class="toolbar">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-view="calendar"></button>
        <button type="button" role="tab" data-view="agenda"></button>
      </div>
      <div class="toolbar-end">
        <button id="icsBtn" class="btn ghost" type="button"></button>
        <button id="primaryBtn" class="btn primary" type="button"></button>
      </div>
    </div>

    <section id="view" aria-live="polite"></section>
    <section id="legend" class="legend"></section>
  </main>

  <dialog id="dlg"><div id="dlgBody"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
